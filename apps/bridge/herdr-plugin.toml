id = "herdrop"
name = "Herdrop"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Deliver browser annotations to agents in Herdr panes."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[startup]]
command = ["target/release/herdrop", "start"]
platforms = ["linux", "macos"]

[[startup]]
command = ['.\target\release\herdrop.exe', "start"]
platforms = ["windows"]

[[actions]]
id = "start"
title = "Start Herdrop bridge"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["target/release/herdrop", "start"]

[[actions]]
id = "start-windows"
title = "Start Herdrop bridge"
contexts = ["global"]
platforms = ["windows"]
command = ['.\target\release\herdrop.exe', "start"]

[[actions]]
id = "stop"
title = "Stop Herdrop bridge"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["target/release/herdrop", "stop"]

[[actions]]
id = "stop-windows"
title = "Stop Herdrop bridge"
contexts = ["global"]
platforms = ["windows"]
command = ['.\target\release\herdrop.exe', "stop"]

[[actions]]
id = "status"
title = "Herdrop status"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["target/release/herdrop", "status"]

[[actions]]
id = "status-windows"
title = "Herdrop status"
contexts = ["global"]
platforms = ["windows"]
command = ['.\target\release\herdrop.exe', "status"]

[[actions]]
id = "extension-path"
title = "Show Herdrop extension folder"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["target/release/herdrop", "extension-path"]

[[actions]]
id = "extension-path-windows"
title = "Show Herdrop extension folder"
contexts = ["global"]
platforms = ["windows"]
command = ['.\target\release\herdrop.exe', "extension-path"]

[[actions]]
id = "prune"
title = "Prune old drops"
contexts = ["pane"]
platforms = ["linux", "macos"]
command = ["target/release/herdrop", "prune"]

[[actions]]
id = "prune-windows"
title = "Prune old drops"
contexts = ["pane"]
platforms = ["windows"]
command = ['.\target\release\herdrop.exe', "prune"]
